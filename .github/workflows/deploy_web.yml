name: "Deploy Web Version to GitHub Pages"

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Godot Web Export ausführen
      - name: Godot Web Export
        id: export
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          relative_project_path: "./"
          presets_to_export: "Web"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Dateien finden, nach build/web verschieben & ServiceWorker injizieren
      - name: Prepare Build & Inject ServiceWorker
        run: |
          # 1. Zielordner erzwingen
          mkdir -p build/web

          # 2. index.html im Workspace ODER im Godot-Cache suchen
          INDEX_PATH=$(find . /home/runner/.local/share/godot/builds -name "index.html" 2>/dev/null | head -n 1)

          if [ -z "$INDEX_PATH" ]; then
            echo "❌ FEHLER: Keine index.html gefunden! Der Export hat nicht geklappt."
            exit 1
          fi

          SOURCE_DIR=$(dirname "$INDEX_PATH")
          echo "📁 Export-Dateien gefunden in: $SOURCE_DIR"

          # 3. Falls die Dateien noch nicht in build/web liegen, rüberkopieren
          if [ "$(realpath "$SOURCE_DIR")" != "$(realpath build/web)" ]; then
            echo "🚚 Kopiere Spieldateien nach build/web..."
            cp -r "$SOURCE_DIR"/* build/web/
          fi

          # 4. ServiceWorker herunterladen & injizieren
          curl -fsSL https://unpkg.com/coi-serviceworker/coi-serviceworker.js -o build/web/coi-serviceworker.js
          sed -i 's/<head>/<head><script src="coi-serviceworker.js"><\/script>/g' build/web/index.html
          echo "✅ Vorbereitung erfolgreich abgeschlossen!"

      # 3. Artifact für GitHub Pages hochladen
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      # 4. Auf GitHub Pages veröffentlichen
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
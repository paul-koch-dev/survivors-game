name: "Deploy Web Version to GitHub Pages"

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Godot Web Export ausführen
      - name: Godot Web Export
        id: export
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          relative_project_path: "./"
          presets_to_export: "Web"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Ordnerstruktur korrigieren & ServiceWorker injizieren
      - name: Inject COOP/COEP ServiceWorker
        run: |
          # Falls die Dateien in build/web/Web gelandet sind, eine Ebene nach oben verschieben:
          if [ -d "build/web/Web" ]; then
            mv build/web/Web/* build/web/ 2>/dev/null || true
            rm -rf build/web/Web
          fi

          # ServiceWorker herunterladen & injizieren
          curl -fsSL https://unpkg.com/coi-serviceworker/coi-serviceworker.js -o build/web/coi-serviceworker.js
          sed -i 's/<head>/<head><script src="coi-serviceworker.js"><\/script>/g' build/web/index.html

      # 3. Artifact für GitHub Pages hochladen
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      # 4. Auf GitHub Pages veröffentlichen
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4